services:
  nodepool:
    image: ${NODEPOOL_IMAGE:-ghcr.io/lectwolf/mihomo-nodepool:latest}
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      DATA_DIR: /app/data
    volumes:
      - nodepool_data:/app/data
    stop_grace_period: 15s

volumes:
  nodepool_data:
