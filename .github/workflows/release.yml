name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable vX.Y.Z tag'; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - name: Build embedded application
        env:
          NODEPOOL_VERSION: ${{ github.ref_name }}
          NODEPOOL_COMMIT: ${{ github.sha }}
        run: node scripts/build.mjs
      - name: Test backend
        working-directory: backend
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test ./...
          go vet ./...
      - name: Build Linux release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILD_TIME=$built_at" >> "$GITHUB_ENV"
          pkg=github.com/LectWolf/mihomo-nodepool/backend/internal/buildinfo
          mkdir -p build/release
          for arch in amd64 arm64; do
            mkdir -p "build/linux_$arch"
            (
              cd backend
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
                -ldflags="-s -w -X $pkg.Version=$RELEASE_TAG -X $pkg.Commit=$RELEASE_COMMIT -X $pkg.BuildTime=$built_at" \
                -o "../build/linux_$arch/nodepool" ./cmd/nodepool
            )
            tar -C "build/linux_$arch" -czf "build/release/nodepool_${RELEASE_TAG}_linux_${arch}.tar.gz" nodepool
          done
          (cd build/release && sha256sum *.tar.gz > checksums.txt)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/lectwolf/mihomo-nodepool
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" build/release/* --verify-tag --generate-notes --title "$RELEASE_TAG"
